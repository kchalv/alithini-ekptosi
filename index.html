<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Εκπτώσεις με Ιστορικό</title><meta name="description" content="Σύντομα: όλες οι προσφορές των ελληνικών ηλεκτρονικών καταστημάτων, με το ιστορικό της τιμής δίπλα σε κάθε μία.">
<meta name="robots" content="noindex"><meta name="theme-color" content="#1b2340">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#1b2340;--mute:#5d6680;--tag:#ffd84d}
@media (prefers-color-scheme:dark){:root{--bg:#0d1224;--surface:#161d36;--ink:#e8ecf7;--mute:#9aa4c0}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.55 Commissioner,system-ui,sans-serif;padding:24px 16px}
main{max-width:620px}.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;margin-bottom:40px}
.logo i{width:28px;height:28px;background:var(--tag);border-radius:4px 10px 10px 4px;box-shadow:inset 0 0 0 2px #1b2340;position:relative}
.logo i::after{content:"";position:absolute;left:6px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#1b2340}
h1{font-size:clamp(34px,7vw,56px);line-height:1.03;letter-spacing:-.035em;font-weight:900;margin:0 0 18px}
p{color:var(--mute);margin:0 0 14px;max-width:48ch}
.shelf{display:inline-block;background:var(--tag);color:#1b2340;border-radius:6px 16px 16px 6px;padding:12px 20px 12px 30px;margin-top:18px;font-weight:600;position:relative}
.shelf::before{content:"";position:absolute;left:11px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--bg)}
</style></head><body><main>
<div class="logo"><i aria-hidden="true"></i>Εκπτώσεις με Ιστορικό</div>
<h1>Όλες οι εκπτώσεις, με το ιστορικό της τιμής δίπλα.</h1>
<p>Ετοιμάζουμε ένα site με τις προσφορές των ελληνικών ηλεκτρονικών καταστημάτων. Δίπλα σε κάθε προσφορά θα βλέπεις πώς κινήθηκε η τιμή τον τελευταίο μήνα, για να ξέρεις αν είναι η χαμηλότερη.</p>
<span class="shelf">Ανοίγουμε σύντομα</span>
</main></body></html>
